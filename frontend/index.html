<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nutritional Insights</title>

    <link
        href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.0/dist/tailwind.min.css"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <header class="bg-blue-600 p-4 text-white">
        <h1 class="text-3xl font-semibold">Nutritional Insights</h1>
    </header>

    <main class="flex items-center justify-center px-4 py-16">

        <div class="w-full max-w-md bg-white p-6 shadow-lg rounded-lg">

            <h2 class="text-2xl font-semibold text-center mb-6">Login</h2>

            <input
                id="loginEmail"
                type="email"
                placeholder="Email"
                class="p-2 border rounded w-full mb-3"
            >

            <input
                id="loginPassword"
                type="password"
                placeholder="Password"
                class="p-2 border rounded w-full mb-3"
            >

            <button
                id="loginButton"
                class="bg-blue-600 text-white py-2 px-4 rounded w-full mb-3"
            >
                Login
            </button>

            <button
                id="googleLoginButton"
                class="bg-gray-800 text-white py-2 px-4 rounded w-full mb-4"
            >
                Continue with Google
            </button>

            <p
                id="authMessage"
                class="text-center text-sm mb-4"
            ></p>

            <p class="text-center text-sm">
                Don't have an account?
                <a href="register.html" class="text-blue-600 font-semibold">
                    Register
                </a>
            </p>

        </div>

    </main>

    <script src="supabase.js"></script>

    <script>

        const authMessage = document.getElementById("authMessage");

        // Already logged in? Go straight to the dashboard.
        async function checkExistingSession() {
            const { data } =
                await supabaseClient.auth.getSession();

            if (data.session) {
                window.location.href = "dashboard.html";
            }
        }

        // Email/password login
        document
            .getElementById("loginButton")
            .addEventListener("click", async () => {

                const email =
                    document
                        .getElementById("loginEmail")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("loginPassword")
                        .value;

                if (!email || !password) {
                    authMessage.textContent =
                        "Please enter your email and password.";

                    authMessage.className =
                        "text-center text-sm mb-4 text-red-600";

                    return;
                }

                const { error } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                if (error) {
                    authMessage.textContent =
                        error.message;

                    authMessage.className =
                        "text-center text-sm mb-4 text-red-600";

                    return;
                }

                // Successful login
                window.location.href = "/dashboard.html";
            });

        // Google OAuth login
        document
            .getElementById("googleLoginButton")
            .addEventListener("click", async () => {

                const { error } =
                    await supabaseClient.auth.signInWithOAuth({
                        provider: "google",
                        options: {
                            redirectTo: window.location.origin + "/dashboard.html"
                        }
                    });

                if (error) {
                    authMessage.textContent =
                        "Google login failed: " + error.message;

                    authMessage.className =
                        "text-center text-sm mb-4 text-red-600";
                }
            });

        checkExistingSession();

    </script>

</body>
</html>
